appId: com.sandcastle.desktop
productName: Sandcastle
directories:
  buildResources: build
# Cross-compile the Bun backend sidecar for the target arch right before packing.
beforePack: scripts/before-pack.cjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{biome.json,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # The backend binary ships via extraResources (below), not inside the asar —
  # a packed executable can't be exec'd. Keep it out of the asar entirely.
  - '!resources/sidecar'
# The compiled backend sidecar -> Contents/Resources/sidecar/<binary>. Resolved
# at runtime via join(process.resourcesPath, "sidecar", name). Produced per-arch
# by the beforePack hook above.
extraResources:
  - from: resources/sidecar
    to: sidecar
    filter:
      - '**/*'
asarUnpack:
  - resources/**
  - "**/node_modules/node-pty/**"
win:
  executableName: Sandcastle
nsis:
  artifactName: ${name}-${version}-setup-${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: andresmarpz
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: andresmarpz
  repo: sandcastle
  releaseType: draft
